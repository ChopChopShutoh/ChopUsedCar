spring:
  datasource:
    url: jdbc:h2:mem:usedcar-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

app:
  demo-data:
    enabled: false
  inspection-alert-days: 30
  long-stock-days: 90

logging:
  level:
    root: WARN
    com.usedcar: INFO
