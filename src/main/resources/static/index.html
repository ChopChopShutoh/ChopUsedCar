<!doctype html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>中古車在庫管理 | UsedCar Inventory</title>
  <meta name="description" content="中古車在庫の登録・検索・粗利分析を行う Spring Boot 3.4.4 ベースの Web アプリケーション">
  <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3Cpath d='M7 19h18M9 19l2-7h10l2 7M10 22.5h2M20 22.5h2' stroke='%23fff' stroke-width='2' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div class="bg-layer" aria-hidden="true"></div>

  <div class="app">
    <!-- ===================== サイドバー ===================== -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="26" height="26">
            <path d="M6 20h20M8.5 20l2.5-8h10l2.5 8M10 24h2.5M19.5 24H22"
                  fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="brand-text">
          <strong>中古車在庫管理</strong>
          <small>UsedCar Inventory</small>
        </span>
      </div>

      <nav class="nav" aria-label="メインナビゲーション">
        <button class="nav-item is-active" data-nav="dashboard" type="button">
          <svg viewBox="0 0 24 24" class="ico" aria-hidden="true">
            <path d="M4 13h7V4H4v9Zm9 7h7v-9h-7v9ZM4 20h7v-4H4v4Zm9-12h7V4h-7v4Z"
                  fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          </svg>
          <span>ダッシュボード</span>
        </button>
        <button class="nav-item" data-nav="cars" type="button">
          <svg viewBox="0 0 24 24" class="ico" aria-hidden="true">
            <path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor"
                  stroke-width="1.7" stroke-linecap="round"/>
          </svg>
          <span>在庫一覧</span>
          <span class="nav-badge" id="nav-count">-</span>
        </button>
      </nav>

      <div class="sidebar-panel" id="sidebar-summary" aria-live="polite"></div>

      <div class="sidebar-foot">
        <button class="icon-btn" id="theme-toggle" type="button" title="テーマを切り替え">
          <svg viewBox="0 0 24 24" class="ico" aria-hidden="true">
            <path d="M12 3v2m0 14v2m9-9h-2M5 12H3m12.7-6.7-1.4 1.4M9.7 14.3l-1.4 1.4m8.4 0-1.4-1.4M9.7 9.7 8.3 8.3"
                  fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            <circle cx="12" cy="12" r="3.4" fill="none" stroke="currentColor" stroke-width="1.7"/>
          </svg>
          <span>テーマ</span>
        </button>
        <a class="icon-btn" href="/h2-console" target="_blank" rel="noreferrer">
          <svg viewBox="0 0 24 24" class="ico" aria-hidden="true">
            <ellipse cx="12" cy="6.5" rx="7" ry="3" fill="none" stroke="currentColor" stroke-width="1.7"/>
            <path d="M5 6.5v11c0 1.7 3.1 3 7 3s7-1.3 7-3v-11M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"
                  fill="none" stroke="currentColor" stroke-width="1.7"/>
          </svg>
          <span>DB Console</span>
        </a>
        <span class="version">v1.0.0 · Spring Boot 3.4.4</span>
      </div>
    </aside>

    <!-- ===================== メイン ===================== -->
    <div class="main">
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="page-title">ダッシュボード</h1>
          <p id="page-sub">在庫状況・粗利推移・アラートを一目で把握</p>
        </div>

        <div class="topbar-actions">
          <label class="search-field">
            <svg viewBox="0 0 24 24" class="ico" aria-hidden="true">
              <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
              <path d="m16 16 4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <input id="global-search" type="search" placeholder="車台番号 / 車種 / 販売先で検索"
                   autocomplete="off" spellcheck="false">
            <kbd>/</kbd>
          </label>

          <button class="btn btn-ghost" id="btn-export" type="button">
            <svg viewBox="0 0 24 24" class="ico" aria-hidden="true">
              <path d="M12 4v10m0 0 4-4m-4 4-4-4M5 18h14" fill="none" stroke="currentColor"
                    stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>CSV 出力</span>
          </button>

          <button class="btn btn-primary" id="btn-new" type="button">
            <svg viewBox="0 0 24 24" class="ico" aria-hidden="true">
              <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span>新規登録</span>
          </button>
        </div>
      </header>

      <div class="views">
        <section id="view-dashboard" class="view"></section>
        <section id="view-cars" class="view is-hidden"></section>
      </div>
    </div>
  </div>

  <!-- ===================== 詳細ドロワー ===================== -->
  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" hidden aria-label="車両詳細"></aside>

  <!-- ===================== モーダル (登録 / 編集 / 削除確認) ===================== -->
  <div class="modal-root" id="modal-root" hidden></div>

  <!-- ===================== トースト ===================== -->
  <div class="toast-stack" id="toasts" aria-live="polite" aria-atomic="true"></div>

  <!-- フォームの入力補助用 -->
  <datalist id="dl-manufacturers"></datalist>
  <datalist id="dl-suppliers"></datalist>
  <datalist id="dl-buyers"></datalist>
  <datalist id="dl-staff"></datalist>
</body>
</html>
